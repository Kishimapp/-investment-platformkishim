<!DOCTYPE html>
<html>
<head>
    <title>Kishim Investment</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
        }

        header {
            background: #1e293b;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            margin-top: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .balance {
            font-size: 30px;
            font-weight: bold;
        }

        .plan {
            border: 1px solid #475569;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Kishim Investment</h1>
    <p>Test Investment Platform</p>
</header>

<div class="container">

    <div class="card">
        <h2>Create Account</h2>

        <input id="registerName" type="text" placeholder="Your name">

        <input id="registerEmail" type="email" placeholder="Email">

        <input id="registerPassword" type="password" placeholder="Password">

        <button onclick="register()">Create Account</button>
    </div>

    <div class="card">
        <h2>Login</h2>

        <input id="loginEmail" type="email" placeholder="Email">

        <input id="loginPassword" type="password" placeholder="Password">

        <button onclick="login()">Login</button>
    </div>

    <div class="card">
        <h2>Dashboard</h2>

        <p>Your test balance:</p>

        <div class="balance" id="balance">
            ₦0
        </div>

        <button onclick="deposit()">Add Test ₦10,000</button>
    </div>

    <div class="card">
        <h2>Investment Plans</h2>

        <div class="plan">
            <h3>Starter</h3>
            <p>Test investment: ₦10,000</p>
            <button onclick="invest('Starter', 10000)">
                Invest
            </button>
        </div>

        <div class="plan">
            <h3>Standard</h3>
            <p>Test investment: ₦50,000</p>
            <button onclick="invest('Standard', 50000)">
                Invest
            </button>
        </div>

        <div class="plan">
            <h3>Premium</h3>
            <p>Test investment: ₦100,000</p>
            <button onclick="invest('Premium', 100000)">
                Invest
            </button>
        </div>
    </div>

    <div class="card">
        <h2>Withdraw Test Money</h2>

        <input id="withdrawAmount"
               type="number"
               placeholder="Amount">

        <button onclick="withdraw()">
            Request Withdrawal
        </button>
    </div>

    <div class="card">
        <h2>Transactions</h2>

        <div id="transactions">
            No transactions yet.
        </div>
    </div>

</div>

<script>

let token = localStorage.getItem("token");

async function register() {

    const name = document.getElementById("registerName").value;
    const email = document.getElementById("registerEmail").value;
    const password = document.getElementById("registerPassword").value;

    const response = await fetch("/api/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name,
            email,
            password
        })
    });

    const data = await response.json();

    alert(data.message || data.error);
}

async function login() {

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const response = await fetch("/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email,
            password
        })
    });

    const data = await response.json();

    if (data.token) {

        token = data.token;

        localStorage.setItem("token", token);

        alert("Login successful!");

        loadDashboard();

    } else {

        alert(data.error);
    }
}

async function loadDashboard() {

    if (!token) return;

    const response = await fetch("/api/dashboard", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await response.json();

    if (data.user) {

        document.getElementById("balance").innerText =
            "₦" + Number(data.user.balance).toLocaleString();

        let html = "";

        data.transactions.forEach(transaction => {

            html += `
                <p>
                    ${transaction.type}
                    — ₦${Number(transaction.amount).toLocaleString()}
                    — ${transaction.status}
                </p>
            `;

        });

        document.getElementById("transactions").innerHTML =
            html || "No transactions yet.";
    }
}

async function deposit() {

    const response = await fetch("/api/deposit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            amount: 10000
        })
    });

    const data = await response.json();

    alert(data.message || data.error);

    loadDashboard();
}

async function invest(plan, amount) {

    const response = await fetch("/api/invest", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            plan,
            amount
        })
    });

    const data = await response.json();

    alert(data.message || data.error);

    loadDashboard();
}

async function withdraw() {

    const amount =
        Number(document.getElementById("withdrawAmount").value);

    const response = await fetch("/api/withdraw", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            amount
        })
    });

    const data = await response.json();

    alert(data.message || data.error);

    loadDashboard();
}

loadDashboard();

</script>

</body>
</html>
